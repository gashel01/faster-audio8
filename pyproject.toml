[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-audio8"
version = "0.1.0"
description = "Audio8-TTS inference, faster, waveform identical to the bit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tts", "cuda-graphs", "inference", "audio8", "speech-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]

# torch is deliberately not pinned: the right wheel depends on the CUDA
# version installed, and pip picking one for you is how environments break.
dependencies = []

[tool.setuptools.packages.find]
include = ["faster_audio8*"]
